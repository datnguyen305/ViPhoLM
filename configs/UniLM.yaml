vocab:
  type: UniLM_Vocab
  path:
    train: datasets/Wikilingual-dataset/train.json
    dev: datasets/Wikilingual-dataset/dev.json
    test: datasets/Wikilingual-dataset/test.json
  min_freq: 3
  fasttext_dim: 300
  bos_token: <bos>
  eos_token: <eos>
  unk_token: <unk>
  pad_token: <pad>
  train_fasttext: True
  window_size: 5
  num_workers: 4

dataset:
  train: 
    type: TextSumDatasetUniLM
    path: datasets/Wikilingual-dataset/train.json
  dev:
    type: TextSumDatasetUniLM
    path: datasets/Wikilingual-dataset/dev.json
  test: 
    type: TextSumDatasetUniLM
    path: datasets/Wikilingual-dataset/test.json
  batch_size: 16
  num_workers: 16

model:
  name: Transformer_Wikilingual
  architecture: TransformerModel
  d_model: 512
  n_layers: 6
  n_head: 8
  ffn_hidden: 2048
  drop_prob: 0.1
  max_len: 1024
  encoder:
    d_model: 512
    n_head: 8
    ffn_hidden: 2048
    drop_prob: 0.1
    n_layers: 6
    max_len: 1024
    device: cpu
  decoder:
    d_model: 512
    n_head: 8
    ffn_hidden: 2048
    drop_prob: 0.1
    n_layers: 6
    max_len: 1024
    device: cpu
  label_smoothing: 0.1
  device: cpu

training:
  checkpoint_path: "checkpoints"
  learning_rate: 0.15   
  lr_coverage: 0.15
  warmup: 1000
  patience: 5
  score: rouge-L

task: TextSumTask