vocab:
  type: Vocab
  path:
    train: datasets/Wikilingual-dataset/train.json
    dev: datasets/Wikilingual-dataset/dev.json
    test: datasets/Wikilingual-dataset/test.json
  min_freq: 3
  bos_token: <bos>
  eos_token: <eos>
  unk_token: <unk>
  pad_token: <pad>

dataset:
  train: 
    type: TextSumDatasetOOV
    path: datasets/Wikilingual-dataset/train.json
  dev:
    type: TextSumDatasetOOV
    path: datasets/Wikilingual-dataset/dev.json
  test: 
    type: TextSumDatasetOOV
    path: datasets/Wikilingual-dataset/test.json
  batch_size: 16
  num_workers: 16

model:
  name: Transformer_Pointer_Wikilingual
  architecture: TransformerPointer 
  d_model: 512
  max_len: 1024
  label_smoothing: 0.1
  device: cpu
  p_gen: True           
  use_coverage: True   
  lambda_cov: 1.0       
  encoder:
    head: 8 
    d_model: 512
    d_kv: 64 
    d_ff: 2048
    device: cpu
  decoder:
    d_model: 512
    head: 8
    ffn_hidden: 2048
    drop_prob: 0.1
    n_layers: 6
    max_len: 1024
    device: cpu

training:
  checkpoint_path: "checkpoints"
  learning_rate: 0.15   
  lr_coverage: 0.15
  warmup: 1000
  patience: 5
  score: rouge-L

task: TextSumTaskOOV